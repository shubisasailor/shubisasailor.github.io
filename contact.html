<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francisco | </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/title-typer.js"></script>
    <script src="js/player.js" defer></script>
    <script>
    (function () {
        function syncVid(isDark) {
            var d = document.getElementById('yt-dark');
            var l = document.getElementById('yt-light');
            if (d) d.style.opacity = isDark ? '1' : '0';
            if (l) l.style.opacity = isDark ? '0' : '1';
        }
        window._syncBgVideos = syncVid;
        document.addEventListener('DOMContentLoaded', function () {
            syncVid(localStorage.getItem('theme') !== 'light');
        });
    })();
    </script>
    <script src="js/rope-theme.js" defer></script>
    <style>
        #yt-dark, #yt-light {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden; transition: opacity 0.65s ease;
        }
        #yt-dark video, #yt-light video {
            position: absolute;
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.78vh;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
        #yt-dark  { opacity: 1; }
        #yt-light { opacity: 0; }

        /* ── Fixed nav (top) ── */
        #fixed-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 450px;
            z-index: 200;
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s cubic-bezier(0.19,1,0.22,1),
                        visibility 1.5s cubic-bezier(0.19,1,0.22,1);
        }
        #fixed-nav.visible { opacity: 1; visibility: visible; }

        /* ── Fixed player (bottom) ── */
        #fixed-player {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 450px;
            z-index: 200;
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s cubic-bezier(0.19,1,0.22,1),
                        visibility 1.5s cubic-bezier(0.19,1,0.22,1);
        }
        #fixed-player.visible { opacity: 1; visibility: visible; }

        /* ── Scrollable middle ── */
        .card-container {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 88px 16px 100px !important;
            width: 100%;
            opacity: 0; visibility: hidden;
            transition: opacity 1.5s cubic-bezier(0.19,1,0.22,1),
                        visibility 1.5s cubic-bezier(0.19,1,0.22,1);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .card-container::-webkit-scrollbar { display: none; }
        .card-container.visible { opacity: 1; visibility: visible; }
        .glass-card { width: 100% !important; max-width: 450px; }

        .section-label {
            font-size: 0.60rem; letter-spacing: 3px; font-weight: bold;
            margin-bottom: 14px; text-transform: uppercase;
            color: var(--section-label-color, rgba(255,255,255,0.55));
        }
        .email-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--email-row-bg, rgba(255,255,255,0.04));
            border: 1px solid var(--email-row-border, rgba(255,255,255,0.08));
            border-radius: 8px; padding: 12px 16px;
            font-size: 0.85rem; color: var(--email-row-text, rgba(255,255,255,0.75));
            word-break: break-all;
        }
        .email-row i { opacity: 0.45; }
        .email-copy  { margin-left: auto; opacity: 0.35; transition: opacity 0.2s; font-size: 0.8rem; cursor: pointer; flex-shrink: 0; }
        .email-copy:hover { opacity: 0.90; }
        .card-divider { height: 1px; background: var(--divider, rgba(255,255,255,0.07)); margin: 18px 0; }

        .form-group { display: flex; flex-direction: column; gap: 10px; }
        .form-input, .form-textarea {
            background: var(--input-bg, rgba(255,255,255,0.04));
            border: 1px solid var(--input-border, rgba(255,255,255,0.08));
            border-radius: 8px; padding: 11px 14px;
            font-family: 'Inter', sans-serif; font-size: 0.82rem;
            color: var(--input-text, white); outline: none;
            transition: border-color 0.2s, background 0.2s; width: 100%; box-sizing: border-box;
        }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--input-ph, rgba(255,255,255,0.28)); }
        .form-input:focus, .form-textarea:focus { border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.07); }
        .form-textarea { resize: none; height: 90px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-input { flex: 1; }
        @media (max-width: 380px) { .form-row { flex-direction: column; } }

        .submit-btn {
            margin-top: 4px; width: 100%; padding: 11px;
            background: var(--submit-bg, rgba(255,255,255,0.06));
            border: 1px solid var(--submit-border, rgba(255,255,255,0.12));
            border-radius: 8px; color: var(--submit-text, rgba(255,255,255,0.70));
            font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 2px; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); color: white; border-color: rgba(255,255,255,0.32); }
        .submit-btn:active:not(:disabled) { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.50; }
        .btn-spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.30); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        .submit-btn.loading .btn-spinner { display: block; }
        .submit-btn.loading .btn-label  { opacity: 0.50; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .song-title   { font-size: 0.78rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255,255,255,0.65) !important; }
        #music-time   { font-size: 0.65rem; opacity: 0.45; white-space: nowrap; min-width: 32px; text-align: right; color: var(--text, white); }
        #music-progress { background: rgba(255,255,255,0.55) !important; box-shadow: 0 0 7px rgba(255,255,255,0.18) !important; }

        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.70); border: 1px solid rgba(255,255,255,0.14);
            backdrop-filter: blur(14px); border-radius: 8px; padding: 10px 18px;
            font-size: 0.80rem; color: rgba(255,255,255,0.80); white-space: nowrap;
            opacity: 0; transition: opacity 0.4s ease; pointer-events: none; z-index: 300;
        }
        #toast.success { border-color: rgba(100,255,150,0.35); color: rgba(150,255,180,0.90); }
        #toast.error   { border-color: rgba(255,100,100,0.35); color: rgba(255,150,150,0.90); }
    </style>
</head>
<body class="contact-page theme-dark">

    <!-- Background videos -->
    <div id="yt-dark">
        <video autoplay muted loop playsinline><source src="media/dark.webm" type="video/webm"></video>
    </div>
    <div id="yt-light">
        <video autoplay muted loop playsinline><source src="media/light.webm" type="video/webm"></video>
    </div>
    <div id="bg-video-overlay"></div>

    <!-- Overlay -->
    <div id="overlay">
        <div class="overlay-blur"></div>
        <div class="enter-button">click to enter...</div>
    </div>

    <!-- Volume control -->
    <div class="top-left-wrapper">
        <div class="volume-container">
            <i class="fas fa-volume-up control-icon" id="mute-btn"></i>
            <input type="range" class="volume-slider" id="volume-bar" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <audio id="bg-audio" loop><source src="" type="audio/mpeg"></audio>
    <div id="toast"></div>

    <!-- Fixed nav (top) -->
    <div id="fixed-nav">
        <div class="glass-card" style="padding:16px 20px;">
            <div class="nav-tabs" style="display:flex;justify-content:space-around;">
                <span onclick="location.href='/'">OVERVIEW</span>
                <span onclick="location.href='/about'">ABOUT</span>
                <span class="active">CONTACT</span>
            </div>
        </div>
    </div>

    <!-- Fixed player (bottom) -->
    <div id="fixed-player">
        <div class="glass-card" style="padding:15px 18px !important;">
            <div style="display:flex;align-items:center;gap:13px;">
                <img id="music-cover" src="media/music-cover/cry.jpg"
                     onerror="this.style.display='none';" alt="Cover"
                     style="width:42px;height:42px;border-radius:7px;object-fit:cover;flex-shrink:0;box-shadow:0 0 14px rgba(255,255,255,0.07);">
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;">
                    <div class="song-title">&#8212;</div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div id="progress-container" style="flex:1;height:3px;background:rgba(255,255,255,0.10);border-radius:10px;cursor:pointer;position:relative;">
                            <div id="music-progress" style="height:100%;width:0%;border-radius:10px;pointer-events:none;transition:width 0.1s linear;"></div>
                        </div>
                        <span id="music-time">0:00</span>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:13px;flex-shrink:0;">
                    <i class="fas fa-backward control-icon" id="prev-btn"      style="font-size:0.83rem;opacity:0.40;"></i>
                    <i class="fas fa-play    control-icon" id="play-pause-btn" style="font-size:1.05rem;opacity:0.75;"></i>
                    <i class="fas fa-forward control-icon" id="next-btn"       style="font-size:0.83rem;opacity:0.40;"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Scrollable middle content -->
    <div class="card-container" id="main-content">
        <div class="glass-card">
            <div class="section-label">reach me at</div>
            <div class="email-row">
                <i class="fas fa-envelope"></i>
                <span id="email-display">shub.professional@gmail.com</span>
                <i class="fas fa-copy email-copy" id="copy-btn" title="Copy email"></i>
            </div>
            <div class="card-divider"></div>
            <div class="section-label">send a message</div>
            <div class="form-group">
                <div class="form-row">
                    <input class="form-input" id="f-name"  type="text"  placeholder="Name"  autocomplete="name">
                    <input class="form-input" id="f-email" type="email" placeholder="Email" autocomplete="email">
                </div>
                <textarea class="form-textarea" id="f-message" placeholder="Message..."></textarea>
                <button class="submit-btn" id="send-btn">
                    <div class="btn-spinner"></div>
                    <span class="btn-label">SEND MESSAGE</span>
                </button>
            </div>
        </div>
    </div>

    <script>
    window.addEventListener('load', function () {
        window.startTitleLoop && window.startTitleLoop('Contact', 300);

        if (typeof emailjs !== 'undefined') {
            emailjs.init({ publicKey: 'ANitUhHu4kV4-js93' });
        }

        var overlay      = document.getElementById('overlay');
        var mainContent  = document.getElementById('main-content');
        var fixedNav     = document.getElementById('fixed-nav');
        var fixedPlayer  = document.getElementById('fixed-player');
        var ytDark       = document.getElementById('yt-dark');
        var ytLight      = document.getElementById('yt-light');
        var audio        = document.getElementById('bg-audio');
        var playPauseBtn = document.getElementById('play-pause-btn');

        function initVideos() {
            var isDark = localStorage.getItem('theme') !== 'light';
            ytDark.style.transition  = 'none';
            ytLight.style.transition = 'none';
            ytDark.style.opacity  = isDark ? '1' : '0';
            ytLight.style.opacity = isDark ? '0' : '1';
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    ytDark.style.transition  = 'opacity 0.65s ease';
                    ytLight.style.transition = 'opacity 0.65s ease';
                });
            });
        }

        window._syncBgVideos = function (isNowDark) {
            ytDark.style.opacity  = isNowDark ? '1' : '0';
            ytLight.style.opacity = isNowDark ? '0' : '1';
        };

        initVideos();

        var _entered = false;
        function enterSite() {
            if (_entered) return;
            _entered = true;
            sessionStorage.setItem('site_entered', '1');
            audio.play()
                .then(function () { window._restoreMusicTime && window._restoreMusicTime(); })
                .catch(function () { document.addEventListener('click', function () { audio.play(); }, { once: true }); });
            if (playPauseBtn) playPauseBtn.classList.replace('fa-play', 'fa-pause');
            overlay.style.opacity = '0';
            setTimeout(function () {
                overlay.style.display = 'none';
                mainContent.classList.add('visible');
                fixedNav.classList.add('visible');
                fixedPlayer.classList.add('visible');
                setTimeout(function () { window._ropeInit && window._ropeInit(); }, 80);
            }, 800);
        }

        window._enterSite = enterSite;

        if (sessionStorage.getItem('site_entered')) {
            overlay.style.display = 'none';
            mainContent.classList.add('visible');
            fixedNav.classList.add('visible');
            fixedPlayer.classList.add('visible');
            audio.play()
                .then(function () { window._restoreMusicTime && window._restoreMusicTime(); })
                .catch(function () { document.addEventListener('click', function () { audio.play(); }, { once: true }); });
            if (playPauseBtn) playPauseBtn.classList.replace('fa-play', 'fa-pause');
            setTimeout(function () { window._ropeInit && window._ropeInit(); }, 80);
        } else {
            overlay.addEventListener('click', enterSite);
        }

        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg; t.className = type || ''; t.style.opacity = '1';
            setTimeout(function () { t.style.opacity = '0'; t.className = ''; }, 3000);
        }

        document.getElementById('copy-btn').addEventListener('click', function () {
            navigator.clipboard.writeText('shub.professional@gmail.com')
                .then(function () { showToast('Email copied!', 'success'); })
                .catch(function () { showToast('Could not copy.', 'error'); });
        });

        document.getElementById('send-btn').addEventListener('click', function () {
            var name  = document.getElementById('f-name').value.trim();
            var email = document.getElementById('f-email').value.trim();
            var msg   = document.getElementById('f-message').value.trim();
            if (!name || !email || !msg) { showToast('Please fill in all fields.', 'error'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email.', 'error'); return; }

            var btn = document.getElementById('send-btn');
            btn.classList.add('loading'); btn.disabled = true;

            function finish() { btn.classList.remove('loading'); btn.disabled = false; }

            function fallbackMailto() {
                var s = encodeURIComponent('Message from ' + name);
                var b = encodeURIComponent('From: ' + name + ' <' + email + '>\n\n' + msg);
                window.open('mailto:shub.professional@gmail.com?subject=' + s + '&body=' + b);
                showToast('Opening mail client...', '');
            }

            if (typeof emailjs === 'undefined') { fallbackMailto(); finish(); return; }

            emailjs.send('service_wfciems', 'template_srqhd09', { name: name, email: email, message: msg })
                .then(function () {
                    showToast('Message sent!', 'success');
                    ['f-name', 'f-email', 'f-message'].forEach(function (id) {
                        document.getElementById(id).value = '';
                    });
                    finish();
                })
                .catch(function () { fallbackMailto(); finish(); });
        });

    });
    </script>
</body>
</html>
