    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.startTitleLoop && window.startTitleLoop('Contact', 300);
            if (typeof emailjs !== 'undefined') emailjs.init({ publicKey: 'ANitUhHu4kV4-js93' });
            
            var overlay = document.getElementById('overlay');
            var mainContent = document.getElementById('main-content');
            var fixedNav = document.getElementById('fixed-nav');
            var fixedPlayer = document.getElementById('fixed-player');
            var ytDark = document.getElementById('yt-dark');
            var ytLight = document.getElementById('yt-light');

            (function initVideos() {
                var dark = localStorage.getItem('theme') !== 'light';
                ytDark.style.transition = ytLight.style.transition = 'none';
                ytDark.style.opacity = dark ? '1' : '0';
                ytLight.style.opacity = dark ? '0' : '1';
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        ytDark.style.transition = ytLight.style.transition = 'opacity 0.65s ease';
                    });
                });
            })();

            window._syncBgVideos = function (dark) {
                ytDark.style.opacity = dark ? '1' : '0';
                ytLight.style.opacity = dark ? '0' : '1';
            };

            function getAudio() { return document.getElementById('bg-audio'); }
            function getPPBtn() { return document.getElementById('play-pause-btn'); }

            function showContent() {
                mainContent.classList.add('visible');
                fixedNav.classList.add('visible');
                fixedPlayer.classList.add('visible');
                setTimeout(function () { if (window._ropeInit) window._ropeInit(); }, 80);
            }

            function updatePlayerState() {
                var active = sessionStorage.getItem('music_active');
                var bored = document.getElementById('bored-state');
                var playerS = document.getElementById('player-state');
                if (active) {
                    if (bored) bored.style.display = 'none';
                    if (playerS) playerS.style.display = 'flex';
                } else {
                    if (bored) bored.style.display = 'flex';
                    if (playerS) playerS.style.display = 'none';
                }
            }

            function playAudio() {
                var au = getAudio();
                if (!au) return;
                updatePlayerState();
                if (!sessionStorage.getItem('music_active')) return;
                au.play().then(function () {
                    if (window._restoreMusicTime) window._restoreMusicTime();
                }).catch(function () {
                    document.addEventListener('click', function () {
                        var a = getAudio();
                        if (a && sessionStorage.getItem('music_active')) a.play().catch(function () { });
                    }, { once: true });
                });
                var pp = getPPBtn();
                if (pp) pp.classList.replace('fa-play', 'fa-pause');
            }

            var bBtn = document.getElementById('bored-btn');
            if (bBtn) bBtn.addEventListener('click', function () {
                sessionStorage.setItem('music_active', '1');
                updatePlayerState();
                playAudio();
            });

            if (sessionStorage.getItem('site_entered')) {
                showContent();
                playAudio();
            } else {
                var _ent = false;
                function enterSite() {
                    if (_ent) return;
                    _ent = true;
                    sessionStorage.setItem('site_entered', '1');
                    playAudio();
                    overlay.style.opacity = '0';
                    setTimeout(function () {
                        overlay.style.display = 'none';
                        showContent();
                    }, 800);
                }
                var _entFired = false;
                function _tryEnter(e) { if (_entFired) return; _entFired = true; if (e && e.cancelable) e.preventDefault(); enterSite(); }
                overlay.addEventListener('click', _tryEnter);
                overlay.addEventListener('touchend', _tryEnter, { passive: false });
                overlay.addEventListener('pointerup', _tryEnter);
            }

            function showToast(msg, type) {
                var t = document.getElementById('toast');
                t.textContent = msg;
                t.className = type || '';
                t.style.opacity = '1';
                setTimeout(function () { t.style.opacity = '0'; t.className = ''; }, 3000);
            }

            var cb = document.getElementById('copy-btn');
            if (cb) cb.addEventListener('click', function () {
                navigator.clipboard.writeText('shub.professional@gmail.com').then(function () {
                    showToast('Email copied!', 'success');
                }).catch(function () {
                    showToast('Could not copy.', 'error');
                });
            });

            var sb = document.getElementById('send-btn');
            if (sb) sb.addEventListener('click', function () {
                var n = (document.getElementById('f-name').value || '').trim();
                var e = (document.getElementById('f-email').value || '').trim();
                var m = (document.getElementById('f-message').value || '').trim();
                if (!n || !e || !m) { showToast('Please fill in all fields.', 'error'); return; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) { showToast('Please enter a valid email.', 'error'); return; }
                sb.classList.add('loading');
                sb.disabled = true;
                function mailto() {
                    window.open('mailto:shub.professional@gmail.com?subject=' + encodeURIComponent('Message from ' + n) + '&body=' + encodeURIComponent('From: ' + n + ' <' + e + '>\n\n' + m));
                    showToast('Opening mail client...', '');
                }
                function done() { sb.classList.remove('loading'); sb.disabled = false; }
                if (typeof emailjs === 'undefined') { mailto(); done(); return; }
                emailjs.send(atob('c2VydmljZV93ZmNpZW1z'), atob('dGVtcGxhdGVfc3JxaGQwOQ=='), { name: n, email: e, message: m }).then(function () {
                    showToast('Message sent!', 'success');
                    document.getElementById('f-name').value = '';
                    document.getElementById('f-email').value = '';
                    document.getElementById('f-message').value = '';
                    done();
                }).catch(function () { mailto(); done(); });
            });
        });
    </script>

                    var ghBtn = document.createElement('a');
                    ghBtn.className = 'repo-btn';
                    ghBtn.href = r.html_url;
                    ghBtn.target = '_blank';
                    ghBtn.title = 'Source Code';
                    ghBtn.innerHTML = '<i class="fab fa-github"></i>';
                    actions.appendChild(ghBtn);
                }
                if (r.homepage || r.featured) {
                    var liveBtn = document.createElement('a');
                    liveBtn.className = 'repo-btn live';
                    liveBtn.href = r.homepage || r.html_url;
                    liveBtn.target = '_blank';
                    liveBtn.title = 'Live Preview';
                    liveBtn.innerHTML = '<i class="fas fa-external-link-alt"></i>';
                    actions.appendChild(liveBtn);
                }
                card.appendChild(info);
                card.appendChild(actions);
                return card;
            }
            window._fetchRepos = function () {
                if (fetched) return;
                fetched = true;
                var featured = [{ name: 'CheapMandu', html_url: 'https://cheapmandu.shop', description: 'Resell of account market', featured: true, language: 'Live Store' }, { name: 'Portfolio SITE', html_url: 'https://cswith.me', description: 'Current portfolio site', featured: true, language: 'Personal' }];
                fetch('https://api.github.com/users/' + GH + '/repos?per_page=100&sort=updated').then(function (r) {
                    if (!r.ok) throw r;
                    return r.json();
                }).then(function (repos) {
                    repos = repos.filter(function (r) { return !r.fork; }).sort(function (a, b) { return b.stargazers_count !== a.stargazers_count ? b.stargazers_count - a.stargazers_count : new Date(b.updated_at) - new Date(a.updated_at); });
                    list.innerHTML = '';
                    if (featured.length) {
                        var h1 = document.createElement('div');
                        h1.className = 'panel-section-title';
                        h1.textContent = 'Live Sites';
                        list.appendChild(h1);
                        featured.forEach(function (r) { list.appendChild(makeCard(r)); });
                    }
                    if (repos.length) {
                        var h2 = document.createElement('div');
                        h2.className = 'panel-section-title';
                        h2.textContent = 'GitHub Repositories';
                        list.appendChild(h2);
                        repos.forEach(function (r) { list.appendChild(makeCard(r)); });
                    }
                }).catch(function () {
                    list.innerHTML = '';
                    featured.forEach(function (r) { list.appendChild(makeCard(r)); });
                });
            };
        })();
    </script>
    <script>
        (function () {
            var btn = document.getElementById('projects-btn');
            var panel = document.getElementById('projects-panel');
            var cBtn = document.getElementById('panel-close-btn');
            var bd = document.getElementById('panel-backdrop');
            var open = false;
            function openPanel() {
                open = true;
                panel.classList.add('open');
                if (btn) btn.classList.add('open');
                if (bd) bd.classList.add('open');
                window._fetchRepos && window._fetchRepos();
            }
            function closePanel() {
                open = false;
                panel.classList.remove('open');
                if (btn) btn.classList.remove('open');
                if (bd) bd.classList.remove('open');
            }
            if (btn) btn.addEventListener('click', function () { open ? closePanel() : openPanel(); });
            if (cBtn) cBtn.addEventListener('click', closePanel);
            if (bd) bd.addEventListener('click', closePanel);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) closePanel(); });

            var sy = 0;
            if (panel) {
                panel.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; }, { passive: true });
                panel.addEventListener('touchend', function (e) { if (e.changedTouches[0].clientY - sy > 55) closePanel(); }, { passive: true });
                var hdr = panel.querySelector('.panel-header');
                var isDrg = false, startPos = { x: 0, y: 0 };
                hdr.onmousedown = function (e) {
                    if (e.target.closest('#panel-close-btn')) return;
                    if (window.innerWidth <= 600) return;
                    isDrg = true;
                    var rect = panel.getBoundingClientRect();
                    startPos.x = e.clientX - rect.left;
                    startPos.y = e.clientY - rect.top;
                    panel.style.top = rect.top + 'px';
                    panel.style.left = rect.left + 'px';
                    panel.style.transform = 'none';
                    panel.style.transition = 'none';
                    document.body.style.cursor = 'grabbing';
                    e.preventDefault();
                };
                var handleMove = function (e) {
                    if (!isDrg) return;
                    panel.style.top = (e.clientY - startPos.y) + 'px';
                    panel.style.left = (e.clientX - startPos.x) + 'px';
                };
                var handleUp = function () {
                    if (!isDrg) return;
                    isDrg = false;
                    document.body.style.cursor = '';
                    panel.style.transition = 'opacity 0.28s ease, visibility 0.28s, transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1)';
                };
                document.addEventListener('mousemove', handleMove);
                document.addEventListener('mouseup', handleUp);
            }
        })();
    </script>
</body>
